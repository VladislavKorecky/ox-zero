[project]
name = "ox-zero"
version = "0.1.0"
description = "AlphaZero engine and analysis tooling for the OXOX board game"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.5.3",
    "textual>=8.2.8",
    "torch>=2.14.0",
    "typer>=0.27.2",
]

[project.scripts]
ox-zero = "ox_zero.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ox_zero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Textual's test harness (`App.run_test`) is async; let pytest-asyncio run
# `async def` tests without a per-test marker.
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
